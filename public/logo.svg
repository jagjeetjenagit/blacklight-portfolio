<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bl-g" x1="14" y1="40" x2="106" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fe6"/>
      <stop offset=".5" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#40d8ff"/>
    </linearGradient>
    <linearGradient id="bl-o" x1="8" y1="0" x2="112" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fe6" stop-opacity="0"/>
      <stop offset=".45" stop-color="#c46bff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#40d8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bl-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#07070f"/>
  <g filter="url(#bl-glow)" stroke-linecap="round" stroke-linejoin="round" transform="matrix(1 0 -0.1 0.86 8 9)">
    <!-- orbit trails -->
    <path d="M20 50 C 34 22, 92 8, 112 24" stroke="url(#bl-o)" stroke-width="1.6"/>
    <path d="M8 90 C 30 110, 92 106, 110 76" stroke="url(#bl-o)" stroke-width="1.6"/>
    <!-- spine -->
    <path d="M60 22 L 32 94" stroke="url(#bl-g)" stroke-width="6"/>
    <!-- upper bowl: sweeps right, pinches back to a sharp middle point -->
    <path d="M44 28 C 64 16, 102 10, 100 26 C 98 40, 70 52, 50 57" stroke="url(#bl-g)" stroke-width="6.5"/>
    <!-- lower bowl: wide swoosh ending in a long tail -->
    <path d="M50 57 C 78 54, 108 60, 100 78 C 92 96, 46 100, 14 94" stroke="url(#bl-g)" stroke-width="6.5"/>
    <!-- white-hot neon cores -->
    <g stroke="#fff" stroke-opacity=".8" stroke-width="1.5">
      <path d="M60 22 L 32 94"/>
      <path d="M44 28 C 64 16, 102 10, 100 26 C 98 40, 70 52, 50 57"/>
      <path d="M50 57 C 78 54, 108 60, 100 78 C 92 96, 46 100, 14 94"/>
    </g>
  </g>
</svg>
