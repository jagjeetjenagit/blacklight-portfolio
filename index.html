<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blacklight Motion — AI Ad &amp; Film Studio</title>
  <meta name="description" content="Blacklight Motion is an AI-powered creative studio making cinematic product ads, UGC, VFX spots and films — delivered in 24–72 hours." />
  <meta name="theme-color" content="#06070d" />
  <meta property="og:title" content="Blacklight Motion — AI Ad &amp; Film Studio" />
  <meta property="og:description" content="Cinematic AI ads, UGC, VFX and films for brands. Delivered in 24–72 hours." />
  <meta property="og:image" content="https://zigsmotion.com/showcase/sizzle.jpg" />
  <link rel="icon" href="./logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://zigsmotion.com" crossorigin />
  <link rel="preload" href="./logo.jpg" as="image" />
  <style>
    /* Preloader: painted before any script runs, faded out by main.jsx once the app is ready. */
    #preload { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(50% 40% at 50% 45%, #1a1030 0%, #06070d 70%); transition: opacity .6s ease, visibility .6s; }
    #preload.done { opacity: 0; visibility: hidden; }
    #preload .pl { display: grid; justify-items: center; gap: 26px; }
    #preload .ring { position: relative; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; }
    #preload .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 2px; background: conic-gradient(from 0deg, transparent 0 55%, #e05cff 75%, #4fc8ff 100%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: pl-spin 1.1s linear infinite; }
    #preload .ring::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; box-shadow: 0 0 50px rgba(170, 90, 255, .55), 0 0 90px rgba(80, 180, 255, .25); animation: pl-pulse 1.6s ease-in-out infinite; }
    #preload img { position: relative; z-index: 1; width: 84px; height: 84px; border-radius: 50%; object-fit: cover; opacity: 0; transform: scale(.85); animation: pl-in .7s .1s cubic-bezier(.16,1,.3,1) forwards; }
    #preload .word { font: 700 15px/1 Orbitron, system-ui, sans-serif; letter-spacing: .28em; color: #f4f5fb; opacity: 0; animation: pl-fade .6s .35s ease forwards; }
    #preload .word b { font-weight: 600; background: linear-gradient(90deg, #e05cff, #9a6bff 45%, #4fc8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #preload .bar { width: 150px; height: 2px; border-radius: 2px; background: #171a2b; overflow: hidden; opacity: 0; animation: pl-fade .4s .5s ease forwards; }
    #preload .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #b06bff, #4fc8ff, transparent); animation: pl-run 1.1s ease-in-out infinite; }
    @keyframes pl-spin { to { transform: rotate(360deg); } }
    @keyframes pl-pulse { 50% { opacity: .55; } }
    @keyframes pl-in { to { opacity: 1; transform: none; } }
    @keyframes pl-fade { to { opacity: 1; } }
    @keyframes pl-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #preload *, #preload *::before, #preload *::after { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
</head>
<body>
  <div id="preload" role="status" aria-label="Loading">
    <div class="pl">
      <div class="ring"><img src="./logo.jpg" alt="" /></div>
      <div class="word">BLACKLIGHT<b>MOTION</b></div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
