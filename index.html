<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blacklight Motion — AI Ad &amp; Film Studio</title>
  <meta name="description" content="Blacklight Motion is an AI video studio: Pixar-style animation, UGC ads, product and real-estate videos, VFX and films. First cut in 24–72 hours." />
  <meta name="theme-color" content="#06070d" />
  <meta property="og:title" content="Blacklight Motion — AI Ad &amp; Film Studio" />
  <meta property="og:description" content="Pixar-style animation, UGC ads, product and real-estate videos made with AI. First cut in 24–72 hours." />
  <meta property="og:image" content="https://zigsmotion.com/showcase/pahadi-girl.jpg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://blacklightmotion.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://blacklightmotion.com/" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="apple-touch-icon" href="./logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fonts load without blocking first paint; system fonts show until they arrive. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=Orbitron:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" /></noscript>
  <link rel="preconnect" href="https://zigsmotion.com" crossorigin />
  <style>
    /* Preloader: painted before any script runs, faded out by main.jsx once the app is ready.
       The neon B draws itself stroke by stroke, then the glow breathes. */
    #preload { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(50% 40% at 50% 45%, #1a1030 0%, #06070d 70%); transition: opacity .6s ease, visibility .6s; }
    #preload.done { opacity: 0; visibility: hidden; }
    #preload .pl { display: grid; justify-items: center; gap: 22px; }
    #preload svg { width: 150px; height: 150px; overflow: visible; }
    #preload .s { stroke-dasharray: 1; stroke-dashoffset: 1; animation: pl-draw .7s cubic-bezier(.65,0,.35,1) forwards; }
    #preload .o { opacity: 0; animation: pl-draw 1s .55s ease-out forwards, pl-fade .6s .55s forwards; }
    #preload .s1 { animation-delay: .05s; }
    #preload .s2 { animation-delay: .3s; animation-duration: .65s; }
    #preload .s3 { animation-delay: .6s; animation-duration: .75s; }
    #preload .glow { animation: pl-breathe 1.8s 1.3s ease-in-out infinite; }
    #preload .word { font: 700 15px/1 Orbitron, system-ui, sans-serif; letter-spacing: .28em; color: #f4f5fb; opacity: 0; animation: pl-fade .6s .8s ease forwards; }
    #preload .word b { font-weight: 600; background: linear-gradient(90deg, #e05cff, #9a6bff 45%, #4fc8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #preload .bar { width: 150px; height: 2px; border-radius: 2px; background: #171a2b; overflow: hidden; opacity: 0; animation: pl-fade .4s 1s ease forwards; }
    #preload .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #b06bff, #4fc8ff, transparent); animation: pl-run 1.1s ease-in-out infinite; }
    @keyframes pl-draw { to { stroke-dashoffset: 0; } }
    @keyframes pl-fade { to { opacity: 1; } }
    @keyframes pl-breathe { 50% { filter: drop-shadow(0 0 14px rgba(190, 100, 255, .65)); } }
    @keyframes pl-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #preload *, #preload *::before, #preload *::after { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }
  </style>
</head>
<body>
  <div id="preload" role="status" aria-label="Loading">
    <div class="pl">
      <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="pl-g" x1="14" y1="40" x2="106" y2="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff4fe6"/><stop offset=".5" stop-color="#9b5cff"/><stop offset="1" stop-color="#40d8ff"/></linearGradient>
          <linearGradient id="pl-o" x1="8" y1="0" x2="112" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff4fe6" stop-opacity="0"/><stop offset=".45" stop-color="#c46bff" stop-opacity=".85"/><stop offset="1" stop-color="#40d8ff" stop-opacity="0"/></linearGradient>
          <filter id="pl-f" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g class="glow"><g filter="url(#pl-f)" stroke-linecap="round" stroke-linejoin="round" transform="matrix(1 0 -0.1 0.86 8 9)">
          <path class="o" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M20 50 C 34 22, 92 8, 112 24" stroke="url(#pl-o)" stroke-width="1.6"/>
          <path class="o" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M8 90 C 30 110, 92 106, 110 76" stroke="url(#pl-o)" stroke-width="1.6"/>
          <path class="s s1" pathLength="1" d="M60 22 L 32 94" stroke="url(#pl-g)" stroke-width="6"/>
          <path class="s s2" pathLength="1" d="M44 28 C 64 16, 102 10, 100 26 C 98 40, 70 52, 50 57" stroke="url(#pl-g)" stroke-width="6.5"/>
          <path class="s s3" pathLength="1" d="M50 57 C 78 54, 108 60, 100 78 C 92 96, 46 100, 14 94" stroke="url(#pl-g)" stroke-width="6.5"/>
          <g stroke="#fff" stroke-opacity=".8" stroke-width="1.5">
            <path class="s s1" pathLength="1" d="M60 22 L 32 94"/>
            <path class="s s2" pathLength="1" d="M44 28 C 64 16, 102 10, 100 26 C 98 40, 70 52, 50 57"/>
            <path class="s s3" pathLength="1" d="M50 57 C 78 54, 108 60, 100 78 C 92 96, 46 100, 14 94"/>
          </g>
        </g></g>
      </svg>
      <div class="word">BLACKLIGHT<b>MOTION</b></div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
